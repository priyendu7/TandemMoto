name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TANDEMMOTO_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      TANDEMMOTO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      TANDEMMOTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      TANDEMMOTO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Derive version from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. See CONTRIBUTING.md > Releasing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$TANDEMMOTO_KEYSTORE_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Verify
        run: ./gradlew ktlintCheck lintRelease testReleaseUnitTest

      - name: Build signed APK
        run: ./gradlew assembleRelease

      - name: Rename APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TandemMoto-${VERSION_NAME}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Remove keystore
        if: always()
        run: rm -f "$TANDEMMOTO_KEYSTORE_PATH"
